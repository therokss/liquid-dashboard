configuration:
  anthropic_api_key:
    name: Chiave API Anthropic
    description: Chiave creata nella Console Anthropic (platform.claude.com). Con Max o Team creala nell'organizzazione collegata ai crediti API del piano. Resta solo nell'add-on.
  chat_model:
    name: Modello per la chat
    description: Modello Claude usato nella chat (predefinito claude-sonnet-5-5).
  chat_effort:
    name: Effort della chat
    description: Quanto ragiona il modello in chat. Più alto = risposte più curate ma più lente e costose.
  analysis_model:
    name: Modello per le analisi
    description: Modello usato da "Suggerisci", "Verifica" e studio dei dispositivi (predefinito claude-opus-5-5).
  suggest_effort:
    name: Effort di "Suggerisci"
    description: Effort per l'analisi degli storici che propone nuove automazioni.
  verify_effort:
    name: Effort di "Verifica"
    description: Effort per la revisione approfondita delle automazioni esistenti.
  devices_effort:
    name: Effort dello studio dei dispositivi
    description: Effort del sotto-agente che cerca sul web le informazioni su un modello di dispositivo.
  monthly_budget_warn_usd:
    name: Budget mensile, soglia di avviso (USD)
    description: Oltre questa spesa stimata del periodo l'add-on mostra un avviso. Con Max o Team, il valore predefinito (25) vuol dire automatico, all'80% del blocco (o dei crediti, se il blocco è 0).
  monthly_budget_block_usd:
    name: Budget mensile, soglia di blocco (USD)
    description: Oltre questa spesa stimata l'add-on smette di chiamare Claude fino al mese (o ciclo di fatturazione) successivo. Con Max o Team, il valore predefinito (50) vuol dire automatico, quando finiscono i crediti del piano.
  claude_plan:
    name: Come paghi Claude
    description: "api = chiave a consumo; max_5x / max_20x / team = la chiave della Console collegata ai crediti API mensili del piano (100 $, 200 $, Team fino a 500 $), che diventano le soglie del budget se lasci quelle predefinite; pro = chiave a consumo (Pro non include crediti API)."
  team_credits_usd:
    name: Crediti mensili del Team (USD)
    description: Solo con il piano Team, 20 $ per posto Standard e 100 $ per Premium, massimo 500 $.
  billing_day:
    name: Giorno di rinnovo del piano
    description: Giorno del mese in cui si rinnova il piano e arrivano i crediti (1-31; con 29-31 nei mesi più corti vale l'ultimo giorno). La spesa si conta da quel giorno; con 1 vale il mese di calendario.
