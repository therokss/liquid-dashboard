name: "Assistente Claude"
description: "Chatta con Claude, crea e verifica le automazioni di Home Assistant"
version: "0.2.0"
slug: "claude_assistant"
url: "https://github.com/therokss/liquid-dashboard"
init: false
homeassistant: "2026.7.0"
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-outline"
panel_title: "Assistente"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/healthz"
backup_exclude:
  - "cache/*"
options:
  anthropic_api_key: ""
  chat_model: "claude-sonnet-5-5"
  chat_effort: "medium"
  analysis_model: "claude-opus-5-5"
  suggest_effort: "high"
  verify_effort: "medium"
  monthly_budget_warn_usd: 25
  monthly_budget_block_usd: 50
schema:
  anthropic_api_key: password
  chat_model: str
  chat_effort: list(low|medium|high|xhigh|max)
  analysis_model: str
  suggest_effort: list(low|medium|high|xhigh|max)
  verify_effort: list(low|medium|high|xhigh|max)
  monthly_budget_warn_usd: float(0,)
  monthly_budget_block_usd: float(0,)
arch:
  - aarch64
  - amd64
